<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gamma | E-Commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-indigo-600 tracking-tight">
                <i class="fas fa-bolt mr-2"></i>GammaStore
            </a>
            <div class="hidden md:flex space-x-8 font-medium">
                <a href="index.html" class="text-indigo-600">Home</a>
                <a href="products.html" class="hover:text-indigo-600 transition">All Products</a>
                <a href="admin.html" class="hover:text-indigo-600 transition">Admin</a>
            </div>
            <div class="flex items-center space-x-4">
                <button class="text-gray-600 hover:text-indigo-600"><i class="fas fa-search text-xl"></i></button>
                <button class="text-gray-600 hover:text-indigo-600 relative">
                    <i class="fas fa-shopping-cart text-xl"></i>
                    <span class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="bg-indigo-600 text-white py-16 md:py-24">
        <div class="container mx-auto px-6 text-center">
            <h1 class="text-4xl md:text-6xl font-extrabold mb-4">Elevate Your Tech Lifestyle</h1>
            <p class="text-lg md:text-xl text-indigo-100 mb-8">Discover premium gadgets and curated electronics.</p>
            <a href="products.html" class="bg-white text-indigo-600 px-8 py-3 rounded-full font-bold text-lg shadow-lg hover:bg-indigo-50 transition">Shop Now</a>
        </div>
    </header>

    <!-- Featured Products Section -->
    <section class="container mx-auto px-6 py-16">
        <div class="flex justify-between items-end mb-10">
            <div>
                <h2 class="text-3xl font-bold text-gray-800">Featured Products</h2>
                <div class="h-1 w-20 bg-indigo-600 mt-2"></div>
            </div>
            <a href="products.html" class="text-indigo-600 font-semibold hover:underline">View All &rarr;</a>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8" id="product-grid">
            <!-- Product Card Template -->
            <!-- Note: These are static placeholders. In full dev, we will fetch via JS from our FastAPI backend. -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-xl transition-shadow duration-300 group">
                <div class="h-64 bg-gray-200 relative overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1511707171635-51a300473441?q=80&w=500&auto=format&fit=crop" alt="Product" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                    <span class="absolute top-4 left-4 bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">New</span>
                </div>
                <div class="p-6">
                    <p class="text-gray-500 text-sm mb-1">Electronics</p>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">Premium Headphones</h3>
                    <div class="flex justify-between items-center">
                        <span class="text-indigo-600 font-bold text-lg">$299.00</span>
                        <a href="detail.html" class="text-gray-400 hover:text-indigo-600 transition"><i class="fas fa-arrow-right"></i></a>
                    </div>
                </div>
            </div>
            <!-- End Card -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-300 py-12">
        <div class="container mx-auto px-6 text-center">
            <p class="text-sm">&copy; 2026 GammaStore. Built with FastAPI & Tailwind.</p>
        </div>
    </footer>

</body>
</html>
