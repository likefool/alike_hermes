<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Todo App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; }
        .done { text-decoration: line-through; color: #9ca3af; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">My Tasks</h1>
        
        <!-- Input Area -->
        <div class="flex mb-4">
            <input type="text" id="todoInput" placeholder="Add a new task..." 
                class="flex-grow px-4 py-2 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="addTodo()" 
                class="bg-blue-500 text-white px-4 py-2 rounded-r-lg hover:bg-blue-600 transition-colors">
                Add
            </button>
        </div>

        <!-- Todo List -->
        <ul id="todoList" class="space-y-2">
            <!-- Items will appear here -->
        </ul>

        <!-- Stats -->
        <div class="mt-6 pt-4 border-t border-gray-100 text-sm text-gray-500 flex justify-between">
            <span id="taskCount">0 tasks remaining</span>
            <button onclick="clearCompleted()" class="hover:text-red-500">Clear Completed</button>
        </div>
    </div>

    <script>
        let todos = JSON.parse(localStorage.getItem('todos')) || [];

        const input = document.getElementById('todoInput');
        const list = document.getElementById('todoList');
        const countText = document.getElementById('taskCount');

        // Listen for Enter key
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        function save() {
            localStorage.setItem('todos', JSON.stringify(todos));
            render();
        }

        function addTodo() {
            const text = input.value.trim();
            if (!text) return;
            
            todos.push({
                id: Date.now(),
                text: text,
                completed: false
            });
            
            input.value = '';
            save();
        }

        function toggleTodo(id) {
            todos = todos.map(todo => 
                todo.id === id ? { ...todo, completed: !todo.completed } : todo
            );
            save();
        }

        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            save();
        }

        function clearCompleted() {
            todos = todos.filter(todo => !todo.completed);
            save();
        }

        function render() {
            list.innerHTML = '';
            
            todos.forEach(todo => {
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-100 group';
                
                const div = document.createElement('div');
                div.className = 'flex items-center space-x-3 flex-grow cursor-pointer';
                div.onclick = () => toggleTodo(todo.id);
                
                const checkbox = document.createElement('div');
                checkbox.className = `w-5 h-5 border-2 rounded flex items-center justify-center ${todo.completed ? 'bg-green-500 border-green-500' : 'border-gray-300'}`;
                if (todo.completed) {
                    checkbox.innerHTML = '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>';
                }

                const span = document.createElement('span');
                span.textContent = todo.text;
                span.className = `text-gray-700 ${todo.completed ? 'done' : ''}`;

                div.appendChild(checkbox);
                div.appendChild(span);

                const delBtn = document.createElement('button');
                delBtn.innerHTML = '&times;';
                delBtn.className = 'text-gray-400 hover:text-red-500 text-xl px-2 opacity-0 group-hover:opacity-100 transition-opacity';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteTodo(todo.id);
                };

                li.appendChild(div);
                li.appendChild(delBtn);
                list.appendChild(li);
            });

            const remaining = todos.filter(t => !t.completed).length;
            countText.textContent = `${remaining} task${remaining === 1 ? '' : 's'} remaining`;
        }

        // Initial render
        render();
    </script>
</body>
</html>
